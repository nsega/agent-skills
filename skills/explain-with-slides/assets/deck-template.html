<!--
  Deck template for explain-with-slides: diagram slides with speaker notes.
  Copy this file, rename it descriptively (e.g. kueue-admission-slides.html),
  and fill in one <section class="slide"> per slide.

  Each slide has two halves:
    .stage  the 16:9 slide: one claim title (h2.claim) + one inline SVG figure
    .notes  the speaker notes: the full explanation, read beside the slide

  Design tokens and the SVG node / edge kit match
  ../illustrate-with-html/assets/base-template.html, so decks and single
  illustrations look like one family. Keep the :root tokens exactly.

  Keys: Left / Right (or PageUp / PageDown) move, Home / End jump, N hides the
  notes, and the URL hash (#3) deep-links a slide. Print gives one slide plus
  its notes per page, so "Save as PDF" makes a handout.

  Everything is inline and self-contained on purpose: no build, no network.
  Delete this comment block in your copy. It is a note to you, not the reader.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- TITLE: e.g. How Kueue admits workloads · slides with notes --></title>
<style>
  :root {
    --ivory:   #FAF9F5;
    --slate:   #141413;
    --clay:    #D97757;   /* the focus of this slide */
    --oat:     #E3DACC;
    --olive:   #788C5D;   /* healthy / happy path */
    --rust:    #B04A3F;   /* problem / failure path */
    --gray-150:#F0EEE6;
    --gray-300:#D1CFC5;
    --gray-500:#87867F;
    --gray-700:#3D3D3A;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ivory); }
  body {
    color: var(--slate);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 28px 24px 40px;
  }
  .deck { max-width: 1320px; margin: 0 auto; }

  /* ── top bar: deck title, counter, controls ── */
  .bar {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 18px;
  }
  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px;
  }
  .bar h1 {
    font-family: var(--serif); font-weight: 500; font-size: 24px;
    letter-spacing: -0.01em;
  }
  .controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .counter { font-family: var(--mono); font-size: 12px; color: var(--gray-500); min-width: 54px; text-align: center; }
  .btn {
    font-family: var(--mono); font-size: 12px; cursor: pointer;
    padding: 6px 12px; border-radius: 8px;
    border: 1.5px solid var(--gray-300); background: #fff; color: var(--slate);
  }
  .btn:hover, .btn:focus-visible { border-color: var(--clay); color: var(--clay); outline: none; }
  .btn[disabled] { opacity: 0.4; cursor: default; border-color: var(--gray-300); color: var(--slate); }
  .progress { height: 3px; background: var(--gray-150); border-radius: 2px; margin-bottom: 18px; }
  .progress span { display: block; height: 100%; width: 0; background: var(--clay); border-radius: 2px; transition: width 160ms ease; }

  /* ── one slide = stage (left) + notes (right) ── */
  .slide { display: none; }
  .slide.current {
    display: grid;
    grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr);
    gap: 24px;
  }
  body.no-notes .slide.current { grid-template-columns: minmax(0, 1fr); }
  body.no-notes .notes { display: none; }

  .stage {
    aspect-ratio: 16 / 9;
    background: #fff;
    border: 1.5px solid var(--gray-300);
    border-radius: 14px;
    padding: 22px 28px 18px;
    display: flex; flex-direction: column; min-width: 0;
  }
  .stage .kicker {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gray-500); margin-bottom: 6px;
  }
  .claim {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(18px, 1.9vw, 27px); line-height: 1.25;
    letter-spacing: -0.01em; margin-bottom: 10px;
  }
  .fig { flex: 1; min-height: 0; width: 100%; display: block; }

  /* Notes take the stage's height and scroll inside it, so the slide never
     jumps when one note is longer than another. */
  .notes {
    position: relative; min-width: 0;
    background: #fff; border: 1.5px solid var(--gray-300); border-radius: 14px;
  }
  .notes-inner { position: absolute; inset: 0; overflow-y: auto; padding: 20px 22px 24px; }
  .notes-label {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--gray-500); margin-bottom: 10px;
  }
  .notes p, .notes li { font-size: 14.5px; line-height: 1.7; color: var(--gray-700); }
  .notes p { margin-bottom: 12px; }
  .notes ul, .notes ol { margin: 0 0 12px 20px; }
  .notes li { margin-bottom: 4px; }
  .notes strong { color: var(--slate); font-weight: 600; }
  .notes code { font-family: var(--mono); font-size: 12.5px; background: var(--gray-150); padding: 1px 5px; border-radius: 4px; }
  .notes pre {
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    background: var(--gray-150); border: 1px solid var(--gray-300);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
    white-space: pre-wrap; color: var(--slate);
  }
  .notes pre code { background: none; padding: 0; font-size: inherit; }
  .notes .gotcha {
    border-left: 3px solid var(--rust); padding: 6px 0 6px 12px; margin-bottom: 12px;
  }
  .notes a { color: var(--clay); }

  /* Numbered marker: the same number on the figure and in the notes ties a
     sentence to the part of the picture it explains. */
  .notes .mk {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--clay); color: #fff;
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    vertical-align: 1px;
  }

  /* ── SVG figure kit (same vocabulary as illustrate-with-html) ──
     Sizes are in viewBox units. With the 960 x 440 viewBox below, 17 units
     renders at roughly 12 to 13px on a laptop screen: do not go smaller. */
  .fig text   { font-family: var(--mono); font-size: 17px; fill: var(--slate); }
  .fig .sub   { font-size: 14px; fill: var(--gray-500); }
  .fig .lbl   { font-size: 14px; fill: var(--gray-700); }
  .fig .big   { font-family: var(--serif); font-size: 22px; }

  .box rect        { fill: #fff; stroke: var(--gray-300); stroke-width: 2; rx: 10; }
  .box.focus rect  { fill: rgba(217,119,87,0.10); stroke: var(--clay); }
  .box.ok rect     { fill: rgba(120,140,93,0.12); stroke: var(--olive); }
  .box.bad rect    { fill: rgba(176,74,63,0.10); stroke: var(--rust); }
  .box.ctx rect    { fill: var(--gray-150); }
  .box.cell rect   { rx: 2; }   /* array cells, table cells: square corners */
  .group           { fill: none; stroke: var(--gray-300); stroke-width: 1.5; stroke-dasharray: 5 5; rx: 14; }

  .edge     { stroke: var(--gray-500); stroke-width: 2; fill: none; marker-end: url(#arrow); }
  .edge.ok  { stroke: var(--olive); marker-end: url(#arrow-olive); }
  .edge.bad { stroke: var(--rust); stroke-dasharray: 6 5; marker-end: url(#arrow-rust); }
  .edge.focus { stroke: var(--clay); marker-end: url(#arrow-clay); }

  /* Build-up across slides: repeat the previous figure, put .dim on the parts
     the reader has already seen, and draw the new part at full strength. */
  .fig .dim { opacity: 0.3; }

  .fig .mk circle { fill: var(--clay); }
  .fig .mk text   { fill: #fff; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }

  /* ── narrow screens: notes stack under the slide ── */
  @media (max-width: 980px) {
    .slide.current { grid-template-columns: minmax(0, 1fr); }
    .notes-inner { position: static; }
    .stage { padding: 16px 18px 12px; }
    .bar { flex-direction: column; align-items: flex-start; }
  }

  /* ── print / Save as PDF: one slide plus its notes per page ── */
  @media print {
    body { padding: 0; }
    .controls, .progress { display: none; }
    .slide, .slide.current {
      display: block !important; break-after: page; page-break-after: always;
    }
    .stage { width: 100%; }
    .notes { display: block !important; margin-top: 14px; border: none; }
    .notes-inner { position: static; padding: 0; }
  }
</style>
</head>
<body>
<div class="deck">

  <div class="bar">
    <div>
      <div class="eyebrow"><!-- e.g. Explainer · Slides with notes --></div>
      <h1><!-- DECK TITLE: the topic, e.g. How Kueue admits workloads --></h1>
    </div>
    <div class="controls">
      <button class="btn" id="prev" aria-label="Previous slide">&larr;</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="btn" id="next" aria-label="Next slide">&rarr;</button>
      <button class="btn" id="toggle-notes" aria-pressed="true" title="Show or hide notes (N)">Notes</button>
    </div>
  </div>
  <div class="progress"><span id="bar"></span></div>

  <!-- SVG defs shared by every figure: arrowheads, one per semantic color. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#87867F"/>
      </marker>
      <marker id="arrow-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#788C5D"/>
      </marker>
      <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#B04A3F"/>
      </marker>
      <marker id="arrow-clay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#D97757"/>
      </marker>
    </defs>
  </svg>

  <main id="slides">

    <!-- ── SLIDE: copy this section once per slide ─────────────────────── -->
    <section class="slide">
      <div class="stage">
        <div class="kicker"><!-- optional: arc position, e.g. Why it exists --></div>
        <h2 class="claim"><!-- CLAIM: one sentence that states this slide's conclusion --></h2>
        <svg class="fig" viewBox="0 0 960 440" role="img" aria-label="<!-- what the figure shows -->">
          <!-- FIGURE: at most ~7 boxes, verb labels on edges, color by meaning.
               Draw edges first so boxes paint over the arrow ends. Example kit:

          <path class="edge" d="M250,220 L420,220"/>
          <text class="lbl" x="335" y="208" text-anchor="middle">calls</text>

          <g class="box"><rect x="60" y="180" width="190" height="80"/>
            <text x="155" y="226" text-anchor="middle">Client</text></g>
          <g class="box focus"><rect x="420" y="180" width="190" height="80"/>
            <text x="515" y="226" text-anchor="middle">The new thing</text></g>

          <g class="mk"><circle cx="420" cy="180" r="13"/><text x="420" y="180">1</text></g>
          -->
        </svg>
      </div>
      <aside class="notes" aria-label="Notes">
        <div class="notes-inner">
          <div class="notes-label">Notes</div>
          <!-- NOTES: 150 to 400 words (300 to 800 characters in Japanese).
               Order: how to read the figure, the point and why it holds, a
               concrete example (code, command, number), then a common
               misconception in <p class="gotcha">. Refer to figure markers
               as <span class="mk">1</span>. Never repeat the claim title. -->
          <p></p>
        </div>
      </aside>
    </section>

  </main>
</div>

<script>
(() => {
  const slides = Array.from(document.querySelectorAll(".slide"));
  const counter = document.getElementById("counter");
  const bar = document.getElementById("bar");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const toggle = document.getElementById("toggle-notes");
  let i = 0;

  function fromHash() {
    const n = parseInt(location.hash.slice(1), 10);
    return Number.isFinite(n) ? Math.min(Math.max(n, 1), slides.length) - 1 : 0;
  }

  function show(k) {
    if (!slides.length) return;
    i = Math.min(Math.max(k, 0), slides.length - 1);
    slides.forEach((s, j) => s.classList.toggle("current", j === i));
    counter.textContent = (i + 1) + " / " + slides.length;
    bar.style.width = ((i + 1) / slides.length * 100) + "%";
    prev.disabled = i === 0;
    next.disabled = i === slides.length - 1;
    const inner = slides[i].querySelector(".notes-inner");
    if (inner) inner.scrollTop = 0;
    // Deep link to the current slide. Sandboxed frames and some file://
    // contexts refuse history writes, and the deck must still work there.
    try {
      if (location.hash !== "#" + (i + 1)) history.replaceState(null, "", "#" + (i + 1));
    } catch (_) { /* navigation still works without the hash */ }
  }

  function setNotes(on) {
    document.body.classList.toggle("no-notes", !on);
    toggle.setAttribute("aria-pressed", String(on));
  }

  prev.addEventListener("click", () => show(i - 1));
  next.addEventListener("click", () => show(i + 1));
  toggle.addEventListener("click", () => setNotes(document.body.classList.contains("no-notes")));
  window.addEventListener("hashchange", () => show(fromHash()));

  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    // Up / Down are left alone so they still scroll a long note.
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); show(i + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
    else if (e.key === "Home") { e.preventDefault(); show(0); }
    else if (e.key === "End") { e.preventDefault(); show(slides.length - 1); }
    else if (e.key === "n" || e.key === "N") { setNotes(document.body.classList.contains("no-notes")); }
  });

  show(fromHash());
})();
</script>
</body>
</html>
