<!--
  Base template for an HTML illustration (Anthropic style).
  Copy this file, rename it descriptively, and fill in the marked regions.
  Keep the :root tokens and the header / canvas / panel / legend conventions.
  Everything is inline and self-contained on purpose — no build, no network.
  Delete this comment block in your copy; it is a note to you, not to the reader.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- TITLE: e.g. Deploy pipeline — annotated flowchart --></title>
<style>
  :root {
    --ivory:   #FAF9F5;
    --slate:   #141413;
    --clay:    #D97757;   /* active / selected / highlighted */
    --oat:     #E3DACC;
    --olive:   #788C5D;   /* success / healthy path */
    --rust:    #B04A3F;   /* failure / error path */
    --gray-150:#F0EEE6;
    --gray-300:#D1CFC5;
    --gray-500:#87867F;
    --gray-700:#3D3D3A;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 56px 24px 96px;
  }
  .sheet { max-width: 980px; margin: 0 auto; }

  /* ── header ───────────────────────────── */
  header { margin-bottom: 40px; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
    margin-bottom: 10px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  h1 code { font-family: var(--mono); font-size: 0.8em; }
  .lead {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--gray-700);
    max-width: 640px;
  }
  .lead code { font-family: var(--mono); font-size: 13px; }

  /* ── two-column layout: content + sticky panel ── */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 32px;
    align-items: start;
  }
  @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }

  /* ── canvas (the main card) ───────────── */
  .canvas {
    border: 1.5px solid var(--gray-300);
    border-radius: 14px;
    background: #fff;
    padding: 28px;
    overflow-x: auto;
  }

  /* ── SVG diagram kit (matches references/flowchart-example.html) ── */
  svg.flow    { display: block; width: 100%; height: auto; min-width: 480px; }
  .flow text  { font-family: var(--mono); font-size: 12px; fill: var(--slate); pointer-events: none; }
  .flow .sub  { font-size: 10px; fill: var(--gray-500); }
  .flow .lbl  { font-size: 10px; fill: var(--gray-500); }

  .node rect      { fill: #fff; stroke: var(--gray-300); stroke-width: 1.5; rx: 8; }
  .node.term rect { fill: var(--gray-150); rx: 22; }
  .node.gate path { fill: #fff; stroke: var(--gray-300); stroke-width: 1.5; }
  .node.ok rect   { fill: rgba(120,140,93,0.12); stroke: var(--olive); }
  .node.bad rect  { fill: rgba(176,74,63,0.10); stroke: var(--rust); }

  .node { cursor: pointer; transition: transform 120ms ease; }
  .node:hover { transform: translateY(-1px); }
  .node.active rect,
  .node.active path        { stroke: var(--clay); stroke-width: 2; }
  .node:focus-visible rect,
  .node:focus-visible path { stroke: var(--clay); stroke-width: 2; }

  .edge     { stroke: var(--gray-500); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .edge.yes { stroke: var(--olive); marker-end: url(#arrow-olive); }
  .edge.no  { stroke: var(--rust); stroke-dasharray: 4 4; marker-end: url(#arrow-rust); }

  /* ── pill (trade-off tags, severity labels) ── */
  .pill {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    padding: 2px 8px; border-radius: 999px;
    background: var(--gray-150); color: var(--gray-700);   /* neutral */
  }
  .pill.ok  { background: rgba(120,140,93,0.18); }   /* pro / healthy */
  .pill.bad { background: rgba(176,74,63,0.14); }    /* con / risk */

  /* ── export button (see the export bar in references/patterns.md) ── */
  .copy {
    font-family: var(--mono); font-size: 12px; cursor: pointer;
    padding: 7px 14px; border-radius: 8px;
    border: 1.5px solid var(--gray-300); background: #fff; color: var(--slate);
  }
  .copy:hover { border-color: var(--clay); color: var(--clay); }

  /* ── sticky side panel ────────────────── */
  aside {
    position: sticky;
    top: 24px;
    border: 1.5px solid var(--gray-300);
    border-radius: 14px;
    background: #fff;
    padding: 20px 20px 22px;
  }
  aside .hint  { font-size: 12px; color: var(--gray-500); margin-bottom: 14px; }
  aside h3     { font-family: var(--serif); font-weight: 500; font-size: 19px; margin-bottom: 6px; }
  aside .meta  { font-family: var(--mono); font-size: 11px; color: var(--gray-500); margin-bottom: 14px; }
  aside p      { font-size: 13.5px; line-height: 1.6; color: var(--gray-700); margin-bottom: 12px; }
  aside pre {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    background: var(--gray-150); border: 1px solid var(--gray-300);
    border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; color: var(--slate);
  }

  /* ── legend ───────────────────────────── */
  .legend {
    display: flex; flex-wrap: wrap; gap: 18px; margin-top: 18px;
    font-size: 12px; color: var(--gray-700);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .chip { width: 22px; height: 14px; border: 1.5px solid var(--gray-300); border-radius: 4px; background: #fff; }
  .chip.gate { transform: rotate(45deg); width: 12px; height: 12px; border-radius: 2px; }
  .chip.ok   { background: rgba(120,140,93,0.12); border-color: var(--olive); }
  .chip.bad  { background: rgba(176,74,63,0.10); border-color: var(--rust); }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <div class="eyebrow"><!-- CATEGORY · KIND, e.g. Illustrations & Diagrams · Flowchart --></div>
    <h1><!-- HEADLINE --></h1>
    <p class="lead">
      <!-- One or two sentences: what this illustrates and where the data came from.
           Name the real source (files, diff, manifests) so the reader trusts it. -->
    </p>
  </header>

  <div class="layout">

    <!-- LEFT: the illustration. Inline SVG for diagrams, or a single .canvas for
         columns / diff / timeline. Remove the aside + .layout grid if a given
         pattern doesn't need a side panel. -->
    <div>
      <div class="canvas">
        <!-- ILLUSTRATION GOES HERE. For a diagram, build on this stub: lay nodes
             out on a fixed grid in viewBox coordinates, edges first so the node
             shapes paint over the arrow ends. Give every clickable group
             data-k="key" and tabindex="0". Delete the <svg> for non-diagram
             patterns (columns, diff, timeline). -->
        <svg class="flow" viewBox="0 0 620 600">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#87867F"/>
            </marker>
            <marker id="arrow-olive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#788C5D"/>
            </marker>
            <marker id="arrow-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#B04A3F"/>
            </marker>
          </defs>

          <!-- edges -->

          <!-- nodes: <g class="node" data-k="…" tabindex="0"> … </g> -->
        </svg>
      </div>

      <!-- Optional legend; keep entries to the semantic colors actually used. -->
      <div class="legend">
        <span><i class="chip"></i> step</span>
        <span><i class="chip ok"></i> success</span>
        <span><i class="chip bad"></i> failure</span>
      </div>
    </div>

    <!-- RIGHT: sticky detail panel that updates on click. Omit for static
         patterns. -->
    <aside id="panel">
      <div class="hint">Click an element to see detail →</div>
      <h3 id="p-title"><!-- default title --></h3>
      <div class="meta" id="p-meta"><!-- default meta --></div>
      <p id="p-body"><!-- default body --></p>
      <pre id="p-code"><!-- default code/snippet --></pre>
    </aside>

  </div>
</div>

<!--
  Interactivity pattern: give each clickable element a data-k="key", build a
  DETAIL map keyed by it, swap the panel on click. Vanilla JS, no libraries.
  See references/flowchart-example.html for a complete worked version.
-->
<script>
const DETAIL = {
  // key: { title, meta, body, code }
};

const items = document.querySelectorAll("[data-k]");
const T = document.getElementById("p-title");
const M = document.getElementById("p-meta");
const B = document.getElementById("p-body");
const C = document.getElementById("p-code");

function activate(el) {
  const d = DETAIL[el.dataset.k];
  if (!d) return;                                     // guard BEFORE selecting,
  items.forEach(x => x.classList.remove("active"));   // or the panel keeps
  el.classList.add("active");                         // showing the last element
  T.textContent = d.title;
  M.textContent = d.meta;
  B.innerHTML = d.body;       // body may contain <code> spans
  C.textContent = d.code;
}

items.forEach(el => {
  el.addEventListener("click", () => activate(el));
  el.addEventListener("keydown", e => {           // needs tabindex="0" on the
    if (e.key === "Enter" || e.key === " ") {     // element to ever fire
      e.preventDefault();
      activate(el);
    }
  });
  if (!DETAIL[el.dataset.k]) console.warn("no DETAIL entry for", el.dataset.k);
});
</script>
</body>
</html>
